<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henyer Manrique | Blog Oficial</title>
    <!-- Fuentes formales (Serif para titulares, Sans-serif para texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-brand: #da1212;
            --dark-grey: #222222;
            --light-grey: #f4f4f4;
            --text-dark: #333333;
            --text-muted: #777777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-grey);
            color: var(--text-dark);
        }

        /* Barra Superior (Top Bar) */
        .top-bar {
            background-color: var(--dark-grey);
            color: white;
            font-size: 0.8rem;
            padding: 0.5rem 5%;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-bar .live {
            background-color: var(--red-brand);
            color: white;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 3px;
        }

        /* Cabecera Principal */
        .main-header {
            background-color: white;
            text-align: center;
            padding: 2rem 5%;
            border-bottom: 2px solid #eaeaea;
        }
        .main-header h1 {
            font-family: 'Merriweather', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--red-brand);
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }
        .main-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Menú de Navegación Rojo */
        .nav-bar {
            background-color: var(--red-brand);
            padding: 0.8rem 5%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        /* Tarjeta de Portada (Noticia Principal) */
        .hero-section {
            background-color: var(--dark-grey);
            color: white;
            padding: 2.5rem;
            border-radius: 4px;
            border-left: 5px solid var(--red-brand);
            margin-bottom: 3rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .hero-image {
            flex: 0 0 300px;
        }
        .hero-image img {
            width: 100%;
            border-radius: 4px;
            border: 2px solid var(--red-brand);
            object-fit: cover;
        }
        .hero-content {
            flex: 1;
        }
        .tag-red {
            display: inline-block;
            background-color: var(--red-brand);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .hero-content h2 {
            font-family: 'Merriweather', serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .hero-content p {
            font-size: 1.1rem;
            color: #cccccc;
            line-height: 1.6;
        }

        /* Títulos de Sección */
        .section-title {
            font-family: 'Merriweather', serif;
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--red-brand);
            padding-left: 10px;
