<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henyer Manrique | Portafolio Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-brand: #da1212;
            --dark-grey: #1a1a1a;
            --light-grey: #f4f5f7;
            --text-dark: #2d2d2d;
            --text-muted: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-grey);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Barra de Navegación Fija */
        .navbar {
            background-color: var(--red-brand);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .navbar .logo {
            color: white;
            font-family: 'Merriweather', serif;
            font-weight: 900;
            font-size: 1.5rem;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #ffcccc; }

        /* Contenedor Principal */
        .container {
            max-width: 1100px;
            margin: 100px auto 40px; /* Margen superior para la barra fija */
            padding: 0 5%;
        }

        /* Sección Portada */
        .hero {
            background-color: var(--dark-grey);
            color: white;
            padding: 3rem;
            border-radius: 8px;
            display: flex;
            gap: 3rem;
            align-items: center;
            margin-bottom: 4rem;
        }
        .hero-img {
            flex: 0 0 280px;
        }
        .hero-img img {
            width: 100%;
            border-radius: 50%;
            border: 4px solid var(--red-brand);
            object-fit: cover;
        }
        .hero-text h1 {
            font-family: 'Merriweather', serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            line-height: 1.1;
        }
        .hero-text p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 1.5rem;
        }
        .btn-link {
            display: inline-block;
            background-color: var(--red-brand);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .btn-link:hover { background-color: #b30e0e; }

        /* Secciones de Contenido */
        .section-wrapper {
            background-color: white;

            border-radius: 8px;
            margin-bottom: 3rem;
